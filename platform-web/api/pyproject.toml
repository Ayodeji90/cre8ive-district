[project]
name = "cre8ive-api"
version = "0.1.0"
description = "Cre8ive District platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "redis>=5.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "arq>=0.26",
    "structlog>=24.1",
    "jinja2>=3.1",
    "weasyprint>=62",
    "pillow>=10.4",
    "cairosvg>=2.7",
    "python-multipart>=0.0.9",
    "anthropic>=0.40.0",
    "openai>=1.55.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "pyright>=1.1.400",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
