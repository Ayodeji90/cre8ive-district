services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cre8ive
      POSTGRES_USER: cre8ive
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cre8ive -d cre8ive"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  branding-agent:
    build: ./services/branding-agent
    environment:
      ENV: development
      AI_STUB: "true"
      SERVICE_API_KEY: ${BRANDING_AGENT_API_KEY:-local-development-key}
    ports:
      - "8001:8000"

  website-agent:
    build: ./services/website-agent
    ports:
      - "8002:8000"

  api:
    build: ./api
    env_file:
      - path: ./api/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://cre8ive:localdev@postgres:5432/cre8ive
      REDIS_URL: redis://redis:6379
      BRANDING_AGENT_URL: http://branding-agent:8000
      BRANDING_AGENT_API_KEY: ${BRANDING_AGENT_API_KEY:-local-development-key}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      branding-agent:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./api:/app

  worker:
    build: ./api
    env_file:
      - path: ./api/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://cre8ive:localdev@postgres:5432/cre8ive
      REDIS_URL: redis://redis:6379
      BRANDING_AGENT_URL: http://branding-agent:8000
      BRANDING_AGENT_API_KEY: ${BRANDING_AGENT_API_KEY:-local-development-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      branding-agent:
        condition: service_started
    command: arq app.worker.WorkerSettings
    volumes:
      - ./api:/app

volumes:
  postgres_data:
