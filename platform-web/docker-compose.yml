services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cre8ive
      POSTGRES_USER: cre8ive
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cre8ive -d cre8ive"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  branding-agent:
    build: ./services/branding-agent
    env_file:
      - path: ../.env
        required: false
    environment:
      ENV: ${ENV:-development}
      AI_STUB: ${AI_STUB:-true}
      SERVICE_API_KEY: ${BRANDING_AGENT_API_KEY:-local-development-key}
    ports:
      - "8001:8000"

  website-agent:
    build: ./services/website-agent
    env_file:
      - path: ../.env
        required: false
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql+asyncpg://cre8ive:localdev@postgres:5432/cre8ive
      USE_IN_MEMORY_REPO: "false"
      SERVICE_API_KEY: ${SERVICE_API_KEY:-local-development-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      AI_STUB: ${AI_STUB:-true}
      DEPLOY_STUB: ${DEPLOY_STUB:-true}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy

  run-engine:
    build: ./services/run-engine
    env_file:
      - path: ../.env
        required: false
    environment:
      ENV: ${ENV:-development}
      AI_STUB: ${AI_STUB:-true}
      DATABASE_URL: postgresql+asyncpg://cre8ive:localdev@postgres:5432/cre8ive
      REDIS_URL: redis://redis:6379/0
      USE_IN_MEMORY_REPO: "false"
      USE_IN_MEMORY_EVENTS: "false"
      SERVICE_API_KEY: ${SERVICE_API_KEY:-local-development-key}
      PLATFORM_API_KEY: ${SERVICE_API_KEY:-local-development-key}
      PLATFORM_API_URL: http://api:8000
    ports:
      - "8003:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build: ./api
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://cre8ive:localdev@postgres:5432/cre8ive
      REDIS_URL: redis://redis:6379
      BRANDING_AGENT_URL: http://branding-agent:8000
      BRANDING_AGENT_API_KEY: ${BRANDING_AGENT_API_KEY:-local-development-key}
      RUN_ENGINE_URL: http://run-engine:8002
      RUN_ENGINE_API_KEY: ${SERVICE_API_KEY:-local-development-key}
      WEBSITE_AGENT_URL: http://website-agent:8000
      WEBSITE_AGENT_API_KEY: ${SERVICE_API_KEY:-local-development-key}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-local-development-key}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      branding-agent:
        condition: service_started
      website-agent:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./api:/app

  worker:
    build: ./api
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://cre8ive:localdev@postgres:5432/cre8ive
      REDIS_URL: redis://redis:6379
      BRANDING_AGENT_URL: http://branding-agent:8000
      BRANDING_AGENT_API_KEY: ${BRANDING_AGENT_API_KEY:-local-development-key}
      WEBSITE_AGENT_URL: http://website-agent:8000
      WEBSITE_AGENT_API_KEY: ${SERVICE_API_KEY:-local-development-key}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-local-development-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      branding-agent:
        condition: service_started
      website-agent:
        condition: service_started
    command: arq app.worker.WorkerSettings
    volumes:
      - ./api:/app

volumes:
  postgres_data:
