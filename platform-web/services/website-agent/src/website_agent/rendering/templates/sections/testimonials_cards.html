<section class="section">
  <div class="container">
    <div style="text-align: center; margin-bottom: 3.5rem;">
      <h2 style="font-size: clamp(1.8rem, 3.5vw, 2.5rem); margin-bottom: 1rem;">
        {{ section.props.heading or 'What Clients Say' }}
      </h2>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem;">
      {% for item in section.props['items'] %}
        <div style="background-color: var(--brand-surface, #fafaf7); padding: 2.25rem; border-radius: var(--theme-radius, 12px); display: flex; flex-direction: column; justify-content: space-between;">
          <p style="font-size: 1.05rem; font-style: italic; color: var(--brand-neutral-900); line-height: 1.6; margin-bottom: 1.5rem;">
            “{{ item.quote }}”
          </p>
          <div>
            <div style="font-weight: 700; font-size: 0.95rem;">{{ item.author }}</div>
            <div style="font-size: 0.85rem; color: var(--brand-neutral-700);">{{ item.role }}</div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
