<section class="section">
  <div class="container" style="max-width: 900px;">
    <div style="text-align: center; margin-bottom: 2.5rem;">
      <h2 style="font-size: clamp(1.8rem, 3.5vw, 2.5rem); margin-bottom: 1rem;">
        {{ section.props.heading or 'Our Story' }}
      </h2>
    </div>
    <div style="font-size: 1.1rem; line-height: 1.8; color: var(--brand-neutral-700, #444); display: flex; flex-direction: column; gap: 1.5rem;">
      {% for p in section.props.paragraphs %}
        <p>{{ p }}</p>
      {% endfor %}
    </div>
  </div>
</section>
