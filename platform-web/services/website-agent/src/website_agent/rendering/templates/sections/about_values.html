<section class="section section-alt">
  <div class="container">
    <div style="text-align: center; margin-bottom: 3.5rem;">
      <h2 style="font-size: clamp(1.8rem, 3.5vw, 2.5rem); margin-bottom: 1rem;">
        {{ section.props.heading or 'What We Stand For' }}
      </h2>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2rem;">
      {% for val in section.props['values'] %}
        <div style="background-color: var(--brand-bg, #fff); padding: 2rem; border-radius: var(--theme-radius, 12px); box-shadow: var(--theme-shadow, none);">
          <div style="font-size: 1.5rem; margin-bottom: 1rem; color: var(--brand-accent);">
            {{ val.icon or '✦' }}
          </div>
          <h3 style="font-size: 1.2rem; margin-bottom: 0.5rem;">{{ val.title }}</h3>
          <p style="color: var(--brand-neutral-700); font-size: 0.95rem; line-height: 1.6;">{{ val.description }}</p>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
