[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cre8ive-website-agent"
version = "0.1.0"
description = "Independent brand-matched website generation service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "jinja2>=3.1",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff==0.16.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# E501: the formatter owns line wrapping; long strings/URLs are unavoidable.
# UP042: StrEnum migration changes enum serialization semantics; opt in deliberately.
ignore = ["B008", "E501", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
