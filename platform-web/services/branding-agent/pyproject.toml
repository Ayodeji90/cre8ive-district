[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cre8ive-branding-agent"
version = "0.1.0"
description = "Independent brand identity and marketing asset generation service"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "boto3>=1.34",
    "cairosvg>=2.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "litellm>=1.63.14",
    "openai>=1.55.0",
    "pillow>=10.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "uvicorn[standard]>=0.30",
    "weasyprint>=62",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
