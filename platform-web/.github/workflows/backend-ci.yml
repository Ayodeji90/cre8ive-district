name: Backend CI

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "api/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cre8ive_test
          POSTGRES_USER: cre8ive
          POSTGRES_PASSWORD: localdev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cre8ive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://cre8ive:localdev@localhost:5432/cre8ive_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret
      AI_STUB: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: pyright

      - name: Run tests
        run: pytest -q
