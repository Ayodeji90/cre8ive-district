name: "CI · Backend"

# Every backend PR check runs here, with no repository secrets. The deploy
# workflow only publishes images after this workflow succeeds on main.
#
# Adding a service? Add lint/test jobs and a docker-build matrix entry, then
# add the job names to ci-gate.needs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Pin the linter: an unpinned `pip install ruff` silently changes rules.
  RUFF_VERSION: "0.16.0"

jobs:
  # ── API ───────────────────────────────────────────────────────────
  api-lint:
    name: "API · Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform-web/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff==${RUFF_VERSION}"
      - run: ruff check .
      - run: ruff format --check .

  api-test:
    name: "API · Test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform-web/api
    env:
      AI_STUB: "true"
      ENV: "test"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: platform-web/api/pyproject.toml
      - run: pip install ".[dev]"
      - name: Run tests with progress and periodic stack traces
        run: |
          python - <<'PY'
          import faulthandler

          faulthandler.dump_traceback_later(180, repeat=True)
          result = 1
          try:
              import pytest

              result = pytest.main(["-vv", "-ra", "--tb=short", "--durations=20"])
          finally:
              faulthandler.cancel_dump_traceback_later()
          raise SystemExit(result)
          PY

  # ── Migrations (Postgres, forward-only) ───────────────────────────
  migrations:
    name: "API · Migrations"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform-web/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cre8ive_test
          POSTGRES_USER: cre8ive
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cre8ive -d cre8ive_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql+asyncpg://cre8ive:testpass@localhost:5432/cre8ive_test"
      ENV: "test"
      AI_STUB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: platform-web/api/pyproject.toml
      - run: pip install .
      - name: Exactly one migration head
        run: |
          heads=$(alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "Expected one migration head, found $heads:"
            alembic heads
            exit 1
          fi
      - name: Upgrade an empty database
        run: alembic upgrade head
      - name: Upgrade is idempotent
        run: alembic upgrade head
      - name: Models match migrations
        run: alembic check
      - name: Create database for legacy Run Engine schema
        run: |
          python - <<'PY'
          import asyncio

          import asyncpg

          async def main():
              connection = await asyncpg.connect(
                  user="cre8ive",
                  password="testpass",
                  database="postgres",
                  host="localhost",
              )
              try:
                  await connection.execute("CREATE DATABASE cre8ive_legacy")
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - name: Reproduce Run Engine startup before migrations
        working-directory: .
        env:
          DATABASE_URL: "postgresql+asyncpg://cre8ive:testpass@localhost:5432/cre8ive_legacy"
          PYTHONPATH: platform-web/services/run-engine/src
        run: |
          python - <<'PY'
          import asyncio
          import os

          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from run_engine.persistence.models import Base

          async def main():
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.begin() as connection:
                  await connection.run_sync(Base.metadata.create_all)
                  await connection.execute(text("ALTER TABLE run_engine_events RENAME TO run_events"))
              await engine.dispose()

          asyncio.run(main())
          PY
      - name: Upgrade legacy Run Engine schema
        working-directory: platform-web/api
        env:
          DATABASE_URL: "postgresql+asyncpg://cre8ive:testpass@localhost:5432/cre8ive_legacy"
        run: |
          alembic upgrade head
          alembic upgrade head
          python - <<'PY'
          import asyncio
          import os

          from sqlalchemy import inspect
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main():
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.connect() as connection:
                  table_names = await connection.run_sync(
                      lambda conn: set(inspect(conn).get_table_names())
                  )
                  assert {"run_events", "run_engine_events"} <= table_names
                  api_event_columns = await connection.run_sync(
                      lambda conn: {
                          column["name"] for column in inspect(conn).get_columns("run_events")
                      }
                  )
                  engine_event_columns = await connection.run_sync(
                      lambda conn: {
                          column["name"]
                          for column in inspect(conn).get_columns("run_engine_events")
                      }
                  )
                  assert "agent_run_id" in api_event_columns
                  assert "run_id" in engine_event_columns
              await engine.dispose()

          asyncio.run(main())
          PY

  # ── Branding Agent ────────────────────────────────────────────────
  branding-agent-lint:
    name: "Branding Agent · Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform-web/services/branding-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff==${RUFF_VERSION}"
      - run: ruff check src tests
      - run: ruff format --check src tests

  branding-agent-test:
    name: "Branding Agent · Test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform-web/services/branding-agent
    env:
      AI_STUB: "true"
      ENV: "test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: platform-web/services/branding-agent/pyproject.toml
      - name: Install system dependencies for WeasyPrint / CairoSVG
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangoft2-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info
      - run: pip install ".[dev]"
      - run: PYTHONPATH=src python -m pytest --tb=short -q

  # ── Website Agent ─────────────────────────────────────────────────
  website-agent-lint:
    name: "Website Agent · Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform-web/services/website-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff==${RUFF_VERSION}"
      - run: ruff check src tests
      - run: ruff format --check src tests

  website-agent-test:
    name: "Website Agent · Test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform-web/services/website-agent
    env:
      AI_STUB: "true"
      ENV: "test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: platform-web/services/website-agent/pyproject.toml
      - run: pip install ".[dev]"
      - run: PYTHONPATH=src python -m pytest --tb=short -q

  # ── Run Engine ────────────────────────────────────────────────────
  run-engine-lint:
    name: "Run Engine · Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform-web/services/run-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff==${RUFF_VERSION}"
      - run: ruff check src tests
      - run: ruff format --check src tests

  run-engine-test:
    name: "Run Engine · Test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform-web/services/run-engine
    env:
      AI_STUB: "true"
      ENV: "test"
      USE_IN_MEMORY_REPO: "true"
      USE_IN_MEMORY_EVENTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: platform-web/services/run-engine/pyproject.toml
      - run: pip install ".[dev]"
      - run: PYTHONPATH=src python -m pytest --tb=short -q

  # ── Local stack definition ────────────────────────────────────────
  compose-config:
    name: "Local stack · Compose config"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f platform-web/docker-compose.yml config -q

  # ── Docker images ─────────────────────────────────────────────────
  docker-build:
    name: "Docker · ${{ matrix.service.tag }}"
    needs:
      - api-lint
      - api-test
      - migrations
      - branding-agent-lint
      - branding-agent-test
      - website-agent-lint
      - website-agent-test
      - run-engine-lint
      - run-engine-test
      - compose-config
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service:
          - { context: "platform-web/api", tag: "api" }
          - { context: "platform-web/services/branding-agent", tag: "branding-agent" }
          - { context: "platform-web/services/website-agent", tag: "website-agent" }
          - { context: "platform-web/services/run-engine", tag: "run-engine" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          tags: cre8ive/${{ matrix.service.tag }}:ci
          load: false
          push: false
          cache-from: type=gha,scope=${{ matrix.service.tag }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,scope={0},mode=max', matrix.service.tag) || '' }}

  # ── Single required check for branch protection ───────────────────
  ci-gate:
    name: "Backend CI gate"
    if: always()
    needs:
      - api-lint
      - api-test
      - migrations
      - branding-agent-lint
      - branding-agent-test
      - website-agent-lint
      - website-agent-test
      - run-engine-lint
      - run-engine-test
      - compose-config
      - docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report job failures, cancellations, and skips
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: details["result"]
              for name, details in jobs.items()
              if details["result"] in {"failure", "cancelled"}
          }
          skipped = [
              name for name, details in jobs.items() if details["result"] == "skipped"
          ]

          for name, result in failed.items():
              print(f"::error title=CI job {result}::{name} finished with {result}.")
          if skipped:
              print("::error title=CI jobs skipped::" + ", ".join(skipped))
          print(
              "Open the named job in this workflow run to see its failing step "
              "or the API test's last test and stack trace."
          )
          sys.exit(1)
          PY
      - run: echo "All backend checks passed."
