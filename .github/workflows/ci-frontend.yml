name: "CI · Frontend"

on:
  push:
    branches: [main]
    paths:
      - "platform-web/apps/**"
      - "platform-web/packages/**"
      - "platform-web/package.json"
      - "platform-web/pnpm-lock.yaml"
      - "platform-web/turbo.json"
      - "platform-web/tsconfig.base.json"
  pull_request:
    paths:
      - "platform-web/apps/**"
      - "platform-web/packages/**"
      - "platform-web/package.json"
      - "platform-web/pnpm-lock.yaml"
      - "platform-web/turbo.json"
      - "platform-web/tsconfig.base.json"

defaults:
  run:
    working-directory: platform-web

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform-web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform-web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform-web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform-web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
